name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # HACS validation reads the repository anonymously, so on a private repo it
    # sees no manifest and calls hacs.json invalid. Runs once the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt ruff
      - run: ruff check custom_components tests
      - run: pytest -q

  bundled-card:
    # The integration serves a copy of the card (scripts/sync_card.sh). Once the card repository
    # is public, fail when the copy differs from its main branch.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          url=https://raw.githubusercontent.com/JanJoh/ha-phase-map-card/main/dist/phase-bus-card.js
          if ! curl -fsSL "$url" -o upstream.js; then
            echo "Card repository not readable (private?): skipping the comparison"; exit 0
          fi
          cmp upstream.js custom_components/phase_map/frontend/phase-bus-card.js \
            || { echo "::error::Bundled card differs from ha-phase-map-card main: run scripts/sync_card.sh"; exit 1; }
